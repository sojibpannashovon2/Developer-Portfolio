<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Mirrors the default Sapphire ramp in src/lib/brand.ts. A favicon is a static file, so it
       cannot follow a visitor's runtime palette choice and always shows the default. -->
  <defs>
    <linearGradient id="a" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Rising-A mark: two legs meeting at an apex, with a crossbar, drawn as a
       continuous stroke so it stays crisp at favicon sizes. -->
  <path d="M6 24 L16 6 L26 24 M10.5 17.5 H21.5" fill="none" stroke="url(#a)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="16" cy="6" r="2.2" fill="#818cf8"/>
</svg>
